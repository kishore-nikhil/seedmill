# Release to PyPI via Trusted Publishing (OIDC) — no API token is stored
# in this repository. PyPI grants the upload based on a short-lived token
# minted for this specific workflow file, on this repo, in the named
# environment; the pairing is registered on PyPI's Publishing page.
#
# Cutting a release:
#   1. bump `version` in pyproject.toml, land it on main
#   2. git tag v0.1.0 && git push --tags
#
# A dry run to TestPyPI first is worth it — a version number on PyPI can
# never be reused, even after deleting the release.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Registry to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

# Never cancel a half-finished upload.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Nothing else keeps the tag and pyproject in step, and a mismatch
      # is only discoverable after the version is spent.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag v$tag does not match pyproject version $packaged"
            exit 1
          fi
          echo "v$tag matches pyproject"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Proves the wheel is self-sufficient: installed outside the repo,
      # with no config/ to fall back on, `init` still finds its template.
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install dist/*.whl
          mkdir -p /tmp/probe-run && cd /tmp/probe-run
          /tmp/probe/bin/seedmill init
          /tmp/probe/bin/seedmill tasks | grep -q example

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write        # mint the OIDC token; this is the whole mechanism
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
