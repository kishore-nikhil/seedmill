name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by publish.yml, so a release cannot ship without the same
  # suite that gates a PR.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately NOT installing the [embeddings] extra: a run without
      # sentence-transformers is what proves the extra is genuinely
      # optional, and it keeps the job under a minute instead of pulling
      # torch on three Python versions.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Import without the optional embeddings extra
        run: python -c "import seedmill.cli, seedmill.engine, seedmill.exporter"

      # Runs load_task end-to-end on every shipped task: vocab loading in
      # two file shapes, seeds, enum injection, and importlib hooks loading.
      # The best smoke test available without a model.
      - name: Load every shipped task config
        run: seedmill tasks --dir config/tasks

      - name: Test
        run: pytest
