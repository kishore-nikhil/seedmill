site_name: seedmill
site_description: Config-driven synthetic data generation for LLM training sets
site_url: https://kishore-nikhil.github.io/seedmill/
repo_url: https://github.com/kishore-nikhil/seedmill
repo_name: kishore-nikhil/seedmill
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Backends: backends.md
  - Task reference: task-reference.md
  - Cookbook: cookbook.md
  - CLI reference: cli.md

# Fail the build on a bad internal link rather than shipping a 404.
strict: true
