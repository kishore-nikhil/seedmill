# Seed concept groups for the interest→icon dataset.
#
# Generation iterates over these concepts (not free-form LLM invention) so
# coverage is controlled and IDs are stable: <concept>_<counter>.
# Each concept yields `per_concept` interest phrasings.
#
# Categories are the `category` field written into each record.

